# Render Blueprint — Multi-Agent AI System (Groq free tier, no paid plans)
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance
# After deploy, set GROQ_API_KEY in the API service env vars (free at console.groq.com)

services:

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  - type: web
    name: multi-agent-ai-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama3-8b-8192          # fast Groq-hosted llama3
      - key: GROQ_API_KEY
        sync: false                    # set after deploy — free at console.groq.com
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2        # ~90 MB — fits in free-tier 512 MB RAM
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "8000"
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma_db
      - key: SQL_DATABASE_URL
        value: sqlite:////tmp/agent_data.db
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_AGENT_ITERATIONS
        value: "3"
      - key: PLAN_MAX_STEPS
        value: "4"
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: EVALUATION_RETRY_LIMIT
        value: "1"
      - key: PYTHON_EXEC_TIMEOUT
        value: "30"
      - key: CORS_ORIGINS
        value: '["*"]'

  # ── Streamlit Frontend ────────────────────────────────────────────────────
  - type: web
    name: multi-agent-ai-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: free
    envVars:
      - key: FRONTEND_API_URL
        sync: false                    # set to https://multi-agent-ai-api.onrender.com after API deploys
